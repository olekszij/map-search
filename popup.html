<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Manrope, system-ui, sans-serif;
        width: 300px;
        margin: 0;
        padding: 14px;
        background: #f7f8fa;
        color: #111827;
      }
      h3 {
        margin: 0 0 6px;
        color: #0f766e;
        font-size: 16px;
      }
      p {
        margin: 0 0 12px;
        font-size: 12px;
        color: #6b7280;
        line-height: 1.4;
      }
      .seg {
        display: flex;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 10px;
        background: #fff;
      }
      .seg button {
        flex: 1;
        border: 0;
        background: transparent;
        padding: 8px;
        cursor: pointer;
        font: inherit;
        color: #6b7280;
      }
      .seg button.active {
        background: #0f766e;
        color: #fff;
        font-weight: 600;
      }
      .btns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .btns button {
        flex: 1;
        border: 0;
        border-radius: 9px;
        padding: 9px 8px;
        cursor: pointer;
        font-weight: 600;
        font: inherit;
        font-size: 12px;
        background: #0f766e;
        color: #fff;
      }
      .btns button.ghost {
        background: #fff;
        color: #374151;
        border: 1px solid #e5e7eb;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #6b7280;
        white-space: pre-wrap;
      }
      a {
        color: #0f766e;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h3>Maps Lead Scraper</h3>
    <p>Main UI is panel on map. This is just for starting.</p>
    <div class="seg" id="zoneSeg">
      <button type="button" data-zone="zone" class="active">Zone</button>
      <button type="button" data-zone="all">Full List</button>
    </div>
    <div class="btns">
      <button id="show" type="button">Panel</button>
      <button id="start" type="button">Start</button>
      <button id="stop" type="button" class="ghost">Stop</button>
    </div>
    <div id="status">Open Maps → zone → 'Rechercher dans cette zone' → Panel / Start.</div>
    <p style="margin-top: 10px"><a href="options.html" target="_blank">Options / CRM</a></p>
    <script src="popup.js"></script>
  </body>
</html>
